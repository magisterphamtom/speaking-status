name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre à jour version et download dans module.json
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${TAG}/speaking-status.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Créer le zip (fichiers à la racine)
        run: zip -r speaking-status.zip module.json speaking-status.js LICENSE README.md

      - name: Joindre manifeste et zip à la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            speaking-status.zip
